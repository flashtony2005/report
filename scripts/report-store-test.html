<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>报表文件 · 保存 / 打开 / 执行</title>
<style>
  :root{--bg:#F5F6F8;--panel:#fff;--border:#E5E6EB;--text:#1F2329;--muted:#86909C;--primary:#1677FF}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
  h2{font-size:13px;margin:0 0 10px;color:var(--text)}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);padding:5px 12px;border-radius:6px}
  button:hover{border-color:var(--primary);color:var(--primary)}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.primary:hover{opacity:.9;color:#fff}
  input,select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  label{font-size:12px;color:var(--muted);min-width:64px}
  table{border-collapse:collapse;margin-top:8px;font-size:12px}
  th,td{border:1px solid var(--border);padding:5px 9px;text-align:left;white-space:nowrap}
  th{background:#F7F8FA;font-weight:600}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:12px;white-space:pre-wrap;word-break:break-all}
  .ok{background:#F6FFED;border:1px solid #B7EB8F;color:#237804}
  .err{background:#FFF2F0;border:1px solid #FFCCC7;color:#CF1322}
  .hint{color:var(--muted);font-size:11.5px;margin-top:6px}
  code{background:#F2F3F5;padding:1px 5px;border-radius:3px;font-size:11.5px}
</style>
</head>
<body>
<h1>报表文件 · 保存 / 打开 / 执行</h1>
<div class="sub">
  存的是「模板 + 数据源声明 + 渲染选项」，不是数据快照。打开时按声明现查，所以同一份文件换参数就是另一份结果。
</div>

<div class="panel">
  <h2>服务端</h2>
  <div class="row">
    <label>地址</label>
    <input id="base" value="http://127.0.0.1:18888" style="width:230px">
    <button id="ping">检查</button>
    <span id="health" class="hint"></span>
  </div>
</div>

<div class="panel">
  <h2>1 · 数据源（可选：不填就只存模板，执行时无数据）</h2>
  <div class="row">
    <label>engine</label>
    <select id="engine" style="width:110px">
      <option value="sqlite">sqlite</option>
      <option value="postgres">postgres</option>
    </select>
    <label>database</label>
    <input id="database" placeholder="sqlite 文件路径，或 postgres 连接串" style="width:280px">
  </div>
  <div class="row">
    <label>table</label>
    <input id="table" placeholder="表名" style="width:180px">
    <label>WHERE</label>
    <input id="where" placeholder="region = ?" style="width:220px">
    <label>params</label>
    <input id="params" placeholder='JSON 数组，如 ["华东"]' style="width:180px">
  </div>
</div>

<div class="panel">
  <h2>2 · 模板</h2>
  <div class="row">
    <label>取模板</label>
    <select id="tplSel" style="min-width:260px"></select>
    <button id="loadTpl">载入</button>
    <span id="tplInfo" class="hint"></span>
  </div>
</div>

<div class="panel">
  <h2>3 · 渲染选项（存的是开关本身）</h2>
  <div class="row">
    <label><input type="checkbox" id="optExportFormula"> 导出公式</label>
    <label style="min-width:auto">每页行 <input id="optRows" type="number" min="0" style="width:70px"></label>
    <label style="min-width:auto">重复表头 <input id="optHead" type="number" min="0" style="width:60px"></label>
    <label style="min-width:auto">重复表尾 <input id="optFoot" type="number" min="0" style="width:60px"></label>
    <label style="min-width:auto">min <input id="optMin" type="number" min="0" style="width:60px"></label>
    <label style="min-width:auto">max <input id="optMax" type="number" min="0" style="width:60px"></label>
    <label style="min-width:auto"><input type="checkbox" id="optKeep"> 空保留</label>
  </div>
</div>

<div class="panel">
  <h2>4 · 保存</h2>
  <div class="row">
    <label>名称</label>
    <input id="rName" placeholder="地区销售汇总" style="width:200px">
    <label>id</label>
    <input id="rId" placeholder="sales-by-region" style="width:200px">
    <button class="primary" id="save">保存</button>
  </div>
  <div class="hint">id 只能用字母、数字、<code>-</code>、<code>_</code>（最长 80）。它会直接当文件名，服务端也据此拦路径穿越。</div>
</div>

<div class="panel">
  <h2>5 · 打开 / 执行 / 删除</h2>
  <div class="row">
    <label>列表</label>
    <select id="list" style="min-width:300px"></select>
    <button id="refresh">刷新</button>
    <button id="open">打开（进自由模板）</button>
    <button class="primary" id="run">执行</button>
    <button id="dl">下载 xlsx</button>
    <button id="del">删除</button>
  </div>
  <div class="row">
    <label>执行参数</label>
    <input id="runParams" placeholder='按数据集名覆盖，如 {"ds1":["华南"]}；留空用文件里存的' style="width:320px">
  </div>
  <div id="msgs"></div>
  <div id="result"></div>
</div>

<div class="panel">
  <h2>文件 JSON（最近一次保存 / 打开的内容）</h2>
  <textarea id="json" rows="14" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11.5px"></textarea>
</div>

<script>
const $ = (id) => document.getElementById(id)

const TPLS = [
  ['sample-template', '分组汇总（服务端样例）'],
  ['cross-tab-template', '交叉表'],
  ['cross-tab-totals-template', '交叉表(含合计)'],
  ['cross-tab-two-metrics', '双指标'],
  ['cross-tab-two-metrics-totals', '双指标(含合计)'],
  ['cross-tab-multi-level', '多级表头'],
]

let curTpl = null

function msg(kind, text) {
  const d = document.createElement('div')
  d.className = 'msg ' + kind
  d.textContent = text
  $('msgs').appendChild(d)
}
function clearMsgs() { $('msgs').innerHTML = ''; $('result').innerHTML = '' }

function suggestId(name) {
  const s = String(name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
  return s.slice(0, 80) || 'report'
}

async function api(method, path, body) {
  const res = await fetch($('base').value.replace(/\/$/, '') + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  })
  const text = await res.text()
  if (!res.ok) {
    const err = new Error(text || (method + ' ' + path + ' → ' + res.status))
    // 让调用方按**状态码**分支。别去匹配文案 —— 文案改个标点就静默失效，
    // 而失效的样子是「覆盖冲突被当成普通错误弹出去」，看不出哪里不对。
    err.status = res.status
    throw err
  }
  return text ? JSON.parse(text) : null
}

/* 保存：服务端对「已存在且没带 force」回 409（防静默覆盖的那道闸）。
   手工测试页也得尊重它 —— 悄悄覆盖掉别的报表正是这道闸要防的事。
   所以 409 时问一句，确认了再带 force 重发。 */
async function saveReport(def) {
  try {
    return await api('PUT', '/api/reports/save', def)
  } catch (e) {
    if (e.status !== 409) throw e
    if (!confirm(e.message + '\n\n要覆盖它吗？')) throw new Error('已取消，没有覆盖')
    return await api('PUT', '/api/reports/save?force=1', def)
  }
}

function buildOptions() {
  const n = (id) => { const v = parseInt($(id).value, 10); return isNaN(v) ? null : v }
  return {
    exportFormula: $('optExportFormula').checked || undefined,
    rowsPerPage: n('optRows') || undefined,
    repeatHeaderRows: n('optHead') || undefined,
    repeatFooterRows: n('optFoot') || undefined,
    expandMinCount: n('optMin') || undefined,
    expandMaxCount: n('optMax') || undefined,
    keepExpandEmpty: $('optKeep').checked || undefined,
  }
}

function buildSources() {
  const table = $('table').value.trim()
  const database = $('database').value.trim()
  if (!table || !database) return []
  let params = []
  const pt = $('params').value.trim()
  if (pt) { try { params = JSON.parse(pt) } catch (e) { throw new Error('params 不是合法 JSON 数组: ' + e.message) } }
  return [{ name: 'ds1', engine: $('engine').value, database, table,
            where: $('where').value.trim() || undefined,
            params: params.length ? params : undefined }]
}

/* ---------------- 初始化 ---------------- */
const sel = $('tplSel')
TPLS.forEach(([ep, name]) => {
  const o = document.createElement('option')
  o.value = ep; o.textContent = name
  sel.appendChild(o)
})

$('ping').onclick = async () => {
  clearMsgs()
  try {
    const h = await api('GET', '/health')
    $('health').textContent = '在线 · ' + h.app + ' ' + h.version
    $('health').style.color = '#237804'
    await refresh()
  } catch (e) {
    $('health').textContent = '连不上：' + e.message
    $('health').style.color = '#CF1322'
  }
}

$('loadTpl').onclick = async () => {
  clearMsgs()
  try {
    curTpl = await api('GET', '/api/report/' + sel.value)
    $('tplInfo').textContent = '已载入：' + (curTpl.sheets || []).length + ' 个 sheet'
    msg('ok', '模板已载入')
  } catch (e) { msg('err', e.message) }
}

$('rName').oninput = () => {
  if (!$('rId').value || $('rId').value === suggestId($('rName').dataset.prev || '')) {
    $('rId').value = suggestId($('rName').value)
  }
  $('rName').dataset.prev = $('rName').value
}

/* ---------------- 保存 ---------------- */
$('save').onclick = async () => {
  clearMsgs()
  try {
    if (!curTpl) throw new Error('先载入一个模板')
    const id = $('rId').value.trim()
    if (!/^[A-Za-z0-9_-]{1,80}$/.test(id)) throw new Error('id 只能用字母数字 - _ ，最长 80')
    let sources
    try { sources = buildSources() } catch (e) { throw e }
    const def = {
      format: 'openprint.report', version: 1, id,
      name: $('rName').value.trim() || id,
      template: curTpl, sources, options: buildOptions(),
    }
    const saved = await saveReport(def)
    msg('ok', '已保存：' + saved.id + '（' + saved.updatedAt + '）')
    $('json').value = JSON.stringify(saved, null, 2)
    await refresh()
  } catch (e) { msg('err', e.message) }
}

/* ---------------- 列表 ---------------- */
async function refresh() {
  try {
    const list = await api('GET', '/api/reports')
    const l = $('list')
    l.innerHTML = ''
    list.forEach((r) => {
      const o = document.createElement('option')
      o.value = r.id
      o.textContent = r.name + '（' + r.sourceCount + ' 数据源 · ' + (r.sheets || []).join('/') + ' · ' + r.bytes + 'B）'
      l.appendChild(o)
    })
    if (!list.length) {
      const o = document.createElement('option')
      o.textContent = '（还没有保存过报表）'
      l.appendChild(o)
    }
  } catch (e) { msg('err', '列表拉取失败：' + e.message) }
}
$('refresh').onclick = () => { clearMsgs(); refresh() }

/* ---------------- 打开 ---------------- */
$('open').onclick = async () => {
  clearMsgs()
  const id = $('list').value
  if (!id) return
  try {
    const def = await api('GET', '/api/reports/' + encodeURIComponent(id))
    curTpl = def.template
    $('rId').value = def.id
    $('rName').value = def.name
    const d = $('database'), t = $('table'), w = $('where'), p = $('params')
    const s0 = (def.sources || [])[0]
    d.value = s0?.database || ''; t.value = s0?.table || ''
    w.value = s0?.where || ''; p.value = s0?.params ? JSON.stringify(s0.params) : ''
    const o = def.options || {}
    $('optExportFormula').checked = !!o.exportFormula
    $('optRows').value = o.rowsPerPage ?? ''
    $('optHead').value = o.repeatHeaderRows ?? ''
    $('optFoot').value = o.repeatFooterRows ?? ''
    $('optMin').value = o.expandMinCount ?? ''
    $('optMax').value = o.expandMaxCount ?? ''
    $('optKeep').checked = !!o.keepExpandEmpty
    $('json').value = JSON.stringify(def, null, 2)
    msg('ok', '已打开：' + def.name + '（表单已回填，可直接改了再存）')
  } catch (e) { msg('err', e.message) }
}

/* ---------------- 执行 ---------------- */
$('run').onclick = async () => {
  clearMsgs()
  const id = $('list').value || $('rId').value.trim()
  if (!id) return
  try {
    let body = {}
    const rp = $('runParams').value.trim()
    if (rp) { try { body = { params: JSON.parse(rp) } } catch (e) { throw new Error('执行参数不是合法 JSON: ' + e.message) } }
    const t0 = performance.now()
    const data = await api('POST', '/api/reports/' + encodeURIComponent(id) + '/run', body)
    const ms = Math.round(performance.now() - t0)
    render(data, ms)
  } catch (e) { msg('err', e.message) }
}

function render(data, ms) {
  const rows = data.sheets[0].rows
  let h = '<div class="msg ok">' + rows.length + ' 行 × ' + rows[0].length + ' 列 · ' + ms + ' ms'
  if (data.warnings && data.warnings.length) h += '\n告警：' + data.warnings.join('；')
  h += '</div>'
  h += '<table><tbody>'
  rows.slice(0, 40).forEach((row) => {
    h += '<tr>' + row.map((c) => '<td class="' + (/^[\d,.-]+$/.test(c.text) ? 'num' : '') + '">' +
      String(c.text ?? '').replace(/[<>&]/g, (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m])) + '</td>').join('') + '</tr>'
  })
  h += '</tbody></table>'
  if (rows.length > 40) h += '<div class="hint">仅显示前 40 行</div>'
  $('result').innerHTML = h
}

/* ---------------- 下载 / 删除 ---------------- */
$('dl').onclick = async () => {
  clearMsgs()
  const id = $('list').value
  if (!id) return
  try {
    const res = await fetch($('base').value.replace(/\/$/, '') + '/api/reports/' + encodeURIComponent(id) + '/xlsx',
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    if (!res.ok) throw new Error(await res.text() || ('导出失败 ' + res.status))
    const blob = await res.blob()
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = id + '.xlsx'
    a.click()
    URL.revokeObjectURL(a.href)
    msg('ok', '已下载 ' + id + '.xlsx（' + blob.size + ' 字节）')
  } catch (e) { msg('err', e.message) }
}

$('del').onclick = async () => {
  clearMsgs()
  const id = $('list').value
  if (!id) return
  if (!confirm('删除报表「' + id + '」？此操作不可撤销。')) return
  try {
    await api('DELETE', '/api/reports/' + encodeURIComponent(id))
    msg('ok', '已删除 ' + id)
    await refresh()
  } catch (e) { msg('err', e.message) }
}

$('ping').click()
</script>
</body>
</html>
