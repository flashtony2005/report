[package]
name = "print-server"
version = "0.1.0"
edition = "2021"
description = "OpenPrint 本地打印客户端服务（Rust 版，127.0.0.1:18888）"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-postgres = "0.7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
rust_xlsxwriter = "0.99.0"
calamine = "0.36.1"
# 票据指令（ESC/POS）要按 GBK 编码中文 —— 票据机内置的是中文字库，不吃 UTF-8。
# 这个 crate 本来就在依赖树里（calamine 带的），这里只是提升成直接依赖。
encoding_rs = "0.8"

[profile.release]
opt-level = 2
lto = false
