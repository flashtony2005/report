name: gates

# 目的只有一个：**让闸自己跑起来**。
#
# 本项目反复吃过同一个亏 ——「闸是绿的、但没人跑」比「红的闸」更坏，
# 因为绿会**主动**产出空头的信心（`架构体检-不足与改进方案.md` §2c）。
# 2026-09-27 之前，这些闸 + 37 个验证脚本全靠手敲，没有任何 CI。
#
# 这里跑的就是本地那条命令 `bash scripts/check-all.sh` —— **同一条，不另写 CI 版**，
# 免得 CI 与本地各跑各的、慢慢漂开（那本身就是一种静默失败）。
#
# ────────────────────────────────────────────────────────────────────────────
# ⚠️ 覆盖边界（别把这条 CI 读成「全都验过了」）
#
#   覆盖 = `check-all.sh` 的覆盖：mirror-check（Rust↔TS 契约）· ts-check ·
#          ts-test（前端纯函数）· ts-project-check ×2 · cargo test ·
#          设计器 UI 单测（**designer-react 全部 44 个 spec**）·
#          **引擎层单测（openprint 全部 70 个 spec）**。
#
#   **不覆盖** 20 个 `fault-inject-*.py` 与 17 个 `verify-*.py`：前者要改源码再还原，
#   后者要起真服务（还有的要 sqlite / postgres / odbc 驱动）。它们仍然只能按需手跑。
#   （第 17 个是 `verify-ci-workflow.py` —— 它**刻意**不放进 `check-all.sh`，
#    因为它会反过来执行 `check-all.sh`，放进去就是无限递归。）
#   → 所以这条 CI 的保证**不多不少**就是 `check-all.sh` 的保证。
#
# ⚠️ `check-all.sh` 的退出码是**三态**：0 通过 / 1 失败 / **2 没跑成**（环境缺东西）。
#   三者都必须让 job 红（非 0 即失败）——「没跑成」**绝不能**算通过，那正是本项目
#   最讨厌的那类假绿。所以下面**不做任何 `|| true`**，也不吞退出码。
#
# ⚠️ 关于「runner 核数会不会让 UI 用例超时」—— **闸 7 是串行的**
#   （`--no-file-parallelism`，**正确性**要求：并行下本机实测 16 条超时假红，
#    见 `ts-test-designer.sh` 顶部）。串行 = 一次只有一个文件在跑、**独占 CPU**
#   ⇒「用例互相抢 CPU 导致超时」这条路**在结构上就不存在**，与 runner 有几个核无关。
#   （旧注释这里写「runner 只有 2 核，我没在 2 核环境验证过」—— 那个担忧对**串行**的闸不成立。）
#   核数现在会写进 `::notice::`（`runner N 核`），所以**不用再猜**。
#   仍未验的只剩「单核速度够不够快」（那是 timeout 问题，不是 starvation 问题）。
#
# ⚠️ 第 7 道 = designer-react **全部 44 个 spec**（2026-09-29 去掉 `grid-report-` 过滤；
#   在此之前只跑 12 个，另外 **32 个没有跑器**）。本机 **349s**（44 文件 / 390 用例，全过）。
# ⚠️ 第 8 道 = 引擎层单测（2026-09-28 补）：本机 ~120s，CI 只要 22s（70 文件 / 915 用例）。
#   两道都排在最后，所以前面任一道红了它们就不会跑。
#   两道都**不依赖宿主**（不用 CUPS / 不用外网），失败就是真失败。
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读就够：这条流水线不写任何东西回仓库。
permissions:
  contents: read

jobs:
  gates:
    name: check-all（8 道闸）
    runs-on: ubuntu-latest
    # 冷启动要装两份 node_modules + 编译 Rust，再加跑闸。**实测**（run #9，当时闸 7 还是**过滤版**）：
    #   作业 234s = 装依赖 44+15s · 缓存 5s · 跑闸 158s。
    # 2026-09-29 闸 7 改成**全量**（+239 用例 / 本机 +164s）→ 跑闸会明显变长，
    # 30 分钟的余量主要就是给这个的（CI 实测值见 `::notice::`）。
    # ⚠️ **别拿本机耗时估 CI** —— 实测两个方向差 2~5 倍：
    #   跑闸总计 本机 363s vs CI 158s；闸 7 185s→96s；闸 8 119s→22s。
    #   （本机 node 是原生 arm64 / M4，不是 Rosetta；沙箱的文件遍历也正常
    #     36k 文件 440ms。**机制未查明** —— 记下来，别猜。）
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 两个前端项目各自的 node_modules。
      #
      # **两边都用 npm**：`package-lock.json` 与 `node_modules/.package-lock.json`
      # 都在，且没有 pnpm 的 `.modules.yaml` → 实际用的就是 npm。
      # （`openprint/pnpm-lock.yaml` 是**遗留物**，与 package-lock 并存会让人分不清
      #  哪个权威 —— 别拿它来装依赖，否则可能解析出另一套版本。）
      #
      # ⚠️ `npm ci` 要求 lock 与 package.json **同步**，不同步它会直接失败。
      #   这是**好事**：不同步说明 lock 该更新了，静默用一套漂了的依赖才是坏事。
      - name: 装依赖（designer-react）
        working-directory: designer-react
        run: npm ci

      - name: 装依赖（openprint）
        working-directory: openprint
        run: npm ci

      # Rust 编译产物缓存。key 跟着 Cargo.lock 走：依赖没变就命中，
      # 变了就自动重建（用 `restore-keys` 兜底拿一份旧的部分缓存）。
      # 注意本机那份 `~/.cargo/config.toml` 把 target-dir 指到了仓库外，
      # CI 上没有那个文件 → 走默认的 `print-server/target`，所以缓存这个路径。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            print-server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('print-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 跑闸
        run: bash scripts/check-all.sh
        # ⚠️ 想确认「这几道闸到底跑没跑」，看 **check-run 的 annotation**，别只看 job 的绿/红：
        #   `job success` 只说明脚本退出码是 0。job log 走 API 要 admin（403），
        #   而同一个 check-run 的 annotation **裸 curl 就能读**。
        #   本脚本成功时发一条 `::notice::`（闸数 + 各道耗时），失败时发 `::error::`
        #   （每个红闸的名字 + 退出码 + 输出尾部，闸名排在前 10 条额度里）。
        #   读法：`python3 scripts/verify-ci-workflow.py --remote`
        #   为什么值得这么做：2026-09-28 加了第 8 道闸之后，step 耗时反而从 186s 降到 165s ——
        #   耗时对不上是**歧义**，当时我**没有任何办法**判断第 8 道到底跑了没有。
