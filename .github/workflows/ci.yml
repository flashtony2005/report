name: gates

# 目的只有一个：**让闸自己跑起来**。
#
# 本项目反复吃过同一个亏 ——「闸是绿的、但没人跑」比「红的闸」更坏，
# 因为绿会**主动**产出空头的信心（`架构体检-不足与改进方案.md` §2c）。
# 2026-09-27 之前，这些闸 + 37 个验证脚本全靠手敲，没有任何 CI。
#
# 这里跑的就是本地那条命令 `bash scripts/check-all.sh` —— **同一条，不另写 CI 版**，
# 免得 CI 与本地各跑各的、慢慢漂开（那本身就是一种静默失败）。
#
# ────────────────────────────────────────────────────────────────────────────
# ⚠️ 覆盖边界（别把这条 CI 读成「全都验过了」）
#
#   作业 `gates` 覆盖 = `check-all.sh` 的覆盖：mirror-check（Rust↔TS 契约）· ts-check ·
#          ts-test（前端纯函数）· ts-project-check ×2 · cargo test ·
#          设计器 UI 单测（**designer-react 全部 44 个 spec**）·
#          **引擎层单测（openprint 全部 70 个 spec）**。
#
#   作业 `fault-inject` 覆盖 = **8/20** 个 `fault-inject-*.py`（2026-10-01 加）：
#          只改源码文本 + 跑一条**已经在上面的闸里**的命令（mirror-check / cargo test /
#          designer-react 的 vitest），零服务、零原生依赖。
#
#   **仍然不覆盖**：
#     · 12 个 `fault-inject-*.py` —— 门禁要 `cargo build` **再起一个 print-server**
#       （探针打 127.0.0.1:18888 / :18907），或者要 `--features odbc` 那套原生驱动。
#       逐条依据写在 `scripts/fault-inject-all.sh` 的 `EXCLUDED` 里。
#     · 17 个 `verify-*.py` —— 多数要起真服务（还有的要 sqlite / postgres / odbc 驱动）。
#       （其中 `verify-ci-workflow.py` **刻意**不放进 `check-all.sh`：它会反过来执行
#        `check-all.sh`，放进去就是无限递归。）
#     · 所以两个作业合起来，保证**仍然不是**「全都验过了」：20 个注入里还有 12 个没跑器。
#
#   ⚠️ 加 `fault-inject` 的理由就是本项目那条招牌病：**「闸是绿的、但没有跑器」**。
#      前两个器官（openprint 引擎层 67 个 spec、designer-react 的 32 个 spec）已关；
#      这是第三个，而且更隐蔽 —— 它是「**证明用例有牙齿的脚本**没人跑」。
#      少了它，前面所有的绿都只是**未被检验的自信**。
# ────────────────────────────────────────────────────────────────────────────
#
# ⚠️ `check-all.sh` 的退出码是**三态**：0 通过 / 1 失败 / **2 没跑成**（环境缺东西）。
#   三者都必须让 job 红（非 0 即失败）——「没跑成」**绝不能**算通过，那正是本项目
#   最讨厌的那类假绿。所以下面**不做任何 `|| true`**，也不吞退出码。
#
# ⚠️ 关于「runner 核数会不会让 UI 用例超时」—— **闸 7 是串行的**
#   （`--no-file-parallelism`，**正确性**要求：并行下本机实测 16 条超时假红，
#    见 `ts-test-designer.sh` 顶部）。串行 = 一次只有一个文件在跑、**独占 CPU**
#   ⇒「用例互相抢 CPU 导致超时」这条路**在结构上就不存在**，与 runner 有几个核无关。
#   （旧注释这里写「runner 只有 2 核，我没在 2 核环境验证过」—— 那个担忧对**串行**的闸不成立。）
#   核数现在会写进 `::notice::`（`runner N 核`），所以**不用再猜**。
#   仍未验的只剩「单核速度够不够快」（那是 timeout 问题，不是 starvation 问题）。
#
# ⚠️ 第 7 道 = designer-react **全部 44 个 spec**（2026-09-29 去掉 `grid-report-` 过滤；
#   在此之前只跑 12 个，另外 **32 个没有跑器**）。本机 **349s**（44 文件 / 390 用例，全过）。
#   ⚠️ 那个 349s **带 WorkBuddy 会话 shim**；真实本机是 **99s**（见 `check-all.sh` 顶部）。
# ⚠️ 第 8 道 = 引擎层单测（2026-09-28 补）：70 文件。本机 ~130s（带 shim）/ **5s**（真实），CI 23s。
#   两道都排在最后，所以前面任一道红了它们就不会跑。
#   两道都**不依赖宿主**（不用 CUPS / 不用外网），失败就是真失败。
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读就够：这条流水线不写任何东西回仓库。
permissions:
  contents: read

jobs:
  gates:
    name: check-all（8 道闸）
    runs-on: ubuntu-latest
    # 冷启动要装两份 node_modules + 编译 Rust，再加跑闸。
    # **run #13 实测**（闸 7 已是全量）：作业 304s = 装依赖 + 缓存 + **跑闸 234s**。
    # 30 分钟的余量主要就是给「闸 7 全量」的（CI 实测值见 `::notice::`）。
    # ⚠️ **别拿本机耗时估 CI** —— 但原因是**本机数字被污染**，不是 CI 快：
    #   WorkBuddy 会给 `NODE_OPTIONS` 注入一个打 fs 补丁的 `--require` shim
    #   （node-language-shim.cjs），vitest 每文件一进程 ⇒ 本机被放大约 4 倍。
    #   实测同一份代码：带 shim 511s → 清掉 118s。清掉之后
    #   **本机 118s < CI 234s**（M4 对共享 runner）—— 这才是正常方向。
    #   （2026-09-29 查明。此前这里写「机制未查明，本机比 CI 慢 2~5 倍」—— 那个观察是错的，
    #    详见《架构体检》§11.6 与 `check-all.sh` 顶部。）
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 两个前端项目各自的 node_modules。
      #
      # **两边都用 npm**：`package-lock.json` 与 `node_modules/.package-lock.json`
      # 都在，且没有 pnpm 的 `.modules.yaml` → 实际用的就是 npm。
      # （`openprint/pnpm-lock.yaml` 是**遗留物**，与 package-lock 并存会让人分不清
      #  哪个权威 —— 别拿它来装依赖，否则可能解析出另一套版本。）
      #
      # ⚠️ `npm ci` 要求 lock 与 package.json **同步**，不同步它会直接失败。
      #   这是**好事**：不同步说明 lock 该更新了，静默用一套漂了的依赖才是坏事。
      - name: 装依赖（designer-react）
        working-directory: designer-react
        run: npm ci

      - name: 装依赖（openprint）
        working-directory: openprint
        run: npm ci

      # Rust 编译产物缓存。key 跟着 Cargo.lock 走：依赖没变就命中，
      # 变了就自动重建（用 `restore-keys` 兜底拿一份旧的部分缓存）。
      # 注意本机那份 `~/.cargo/config.toml` 把 target-dir 指到了仓库外，
      # CI 上没有那个文件 → 走默认的 `print-server/target`，所以缓存这个路径。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            print-server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('print-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 跑闸
        run: bash scripts/check-all.sh
        # ⚠️ 想确认「这几道闸到底跑没跑」，看 **check-run 的 annotation**，别只看 job 的绿/红：
        #   `job success` 只说明脚本退出码是 0。job log 走 API 要 admin（403），
        #   而同一个 check-run 的 annotation **裸 curl 就能读**。
        #   本脚本成功时发一条 `::notice::`（闸数 + 各道耗时），失败时发 `::error::`
        #   （每个红闸的名字 + 退出码 + 输出尾部，闸名排在前 10 条额度里）。
        #   读法：`python3 scripts/verify-ci-workflow.py --remote`
        #   为什么值得这么做：2026-09-28 加了第 8 道闸之后，step 耗时反而从 186s 降到 165s ——
        #   耗时对不上是**歧义**，当时我**没有任何办法**判断第 8 道到底跑了没有。

  # ──────────────────────────────────────────────────────────────────────────
  # 作业 2：**证明闸的断言真有牙齿**（fault injection）。
  #
  # 与 `gates` **并行**（`needs` 都不写）—— 两者没有先后依赖，串起来只会白白拉长墙钟时间。
  #
  # ⚠️ 覆盖边界：**只覆盖 8/20** 个 `fault-inject-*.py`。逐条分类依据（以及另 12 个
  #    到底要什么）写在 `scripts/fault-inject-all.sh` 顶部与它的 `EXCLUDED` 里。
  #    ⇒ 这个作业的绿，意思是「这 8 个脚本的每条注入都被**指定**用例抓到了」，
  #      **不是**「20 个注入都验过了」。别读成后者。
  #
  # ⚠️ **不许加 `continue-on-error`**：这个作业的全部意义就是「红了要拦」。
  #    加了它 = 红了也不算红 = 原样回到「闸是绿的、但没有跑器」那个病。
  #    （`verify-ci-workflow.py` 的静态校验**明确禁止** `continue-on-error` / `|| true` /
  #      把闸的输出接进管道 —— 三条各有一条故障注入证明它会红。）
  #
  # ⚠️ 它要装两份 node_modules + 编 Rust，和 `gates` 是**重复**的环境准备。
  #    这是「独立作业」的代价，换来的是「闸红了不会顺带把注入也带红」和并行。
  #
  # ⚠️ 耗时主要在两处：`cargo test`（`fault-inject-table-pins.py` 会改 5 次源码
  #    ⇒ 5 次增量重编）和 designer-react 的 vitest（5 个脚本各自跑若干次）。
  #    本机（干净 `NODE_OPTIONS`）实测见 §13；timeout 留了 4 倍余量。
  # ──────────────────────────────────────────────────────────────────────────
  fault-inject:
    name: fault-inject（8 个注入 · 证明闸有牙齿）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 让跑器把**每个脚本的完整日志**落在这个目录里，最后由「留档」那一步整包上传。
    # 为什么非做不可（2026-10-08 实测的教训）：job log 走 API 要 admin（403），
    # 而 annotation 只有 **10 条**额度 —— 一个失败脚本的「1 行头 + 11 行尾部」就吃光了。
    # 那次 CI 红了，我只能看到「漏网清单」的尾巴，**读不到任何一条失败原因**，
    # 根因最后是靠读 `picocolors` / `vitest` 的源码还原的（见《架构体检》§13.7）。
    # 有了 artifact，同样的情况 2 分钟就能定位。
    env:
      FAULT_INJECT_LOG_DIR: ${{ github.workspace }}/fault-inject-logs

    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 与 `gates` 同样的两份依赖：注入脚本的门禁就是这些包自己的 vitest。
      # （`npm ci` 要求 lock 与 package.json 同步，不同步就失败 —— 那是好事。）
      - name: 装依赖（designer-react）
        working-directory: designer-react
        run: npm ci

      - name: 装依赖（openprint）
        working-directory: openprint
        run: npm ci

      # 与 `gates` 同一个 key：两个作业并行时谁先存谁生效，另一个靠 `restore-keys`
      # 拿一份旧的，最坏情况是从头编一次 print-server（`fault-inject-table-pins.py`
      # 本来就要编，所以这份缓存是纯赚）。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            print-server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('print-server/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 跑故障注入
        run: bash scripts/fault-inject-all.sh
        # 与 `check-all.sh` 同一套诊断纪律：失败原因写进 check-run 的 annotation
        # （**唯一**不需要 admin 权限就能读到的输出），成功时发一条 `::notice::`
        # 证明「这几个脚本真的跑了」。脚本自己负责发，这里不需要额外步骤。
        # 退出码三态：0 通过 / 1 有注入漏网 / 2 没跑成（缺 node_modules / 缺 cargo /
        # 工作树被上个脚本留在注入态）—— **三者都必须让 job 红**，所以这里不做任何
        # `|| true`、不接管道、不吞退出码。

      # 跑器自己也要有牙齿：拆掉 `fault-inject-all.sh` 的承重守卫，
      # 要求它以**特定方式**变红（分类完整性 / 退出码捕获 / 前置缺失→没跑成 / 工作树守卫）。
      # 没有这一步，上面那个作业就只是「一个没人验过的跑器」——
      # 把「闸是绿的、但没有跑器」原样往上挪了一层。
      # 快（造两个假脚本 + 跑几次 `--only`，不碰产品代码、不跑 vitest/cargo）。
      - name: 证明这个跑器自己有牙齿
        run: python3 scripts/check-fault-inject-all.py

      # ⚠️ `if: always()`：上面任一步红了都要上传 —— **失败时才是这份日志唯一有用的时候**。
      # `if-no-files-found: ignore`：前面（比如 `npm ci`）就挂了的话这个目录是空的，
      # 那不是错误，别让它再报一个红来盖住真正的红。
      - name: 留档：每个脚本的完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-inject-logs
          path: fault-inject-logs/
          if-no-files-found: ignore
          retention-days: 14
